name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish src/AiNetReview/AiNetReview.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:PublishTrimmed=false
          -o ./publish

      - name: Prepare Release Archive
        shell: pwsh
        run: |
          # ainetreview.json ins Publish-Verzeichnis kopieren
          if (Test-Path "ainetreview.json") {
            Copy-Item "ainetreview.json" "./publish/ainetreview.json"
          }

          # README.md ins Publish-Verzeichnis kopieren
          if (Test-Path "README.md") {
            Copy-Item "README.md" "./publish/README.md"
          }

          # LICENSE ins Publish-Verzeichnis kopieren
          if (Test-Path "LICENSE") {
            Copy-Item "LICENSE" "./publish/LICENSE"
          }

          # Archiv aus dem Publish-Verzeichnis erstellen
          Push-Location "./publish"
          7z a "../AiNetReview-win-x64.zip" . -r | Out-Null
          Pop-Location

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ./AiNetReview-win-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
